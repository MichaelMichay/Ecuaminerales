{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | ECUMINERALES</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card shadow-lg">

            <div class="text-center mb-4">
                <img src="{% static 'img/logo_ecuaminerales.jpeg' %}" class="login-logo" alt="Logo ECUAMINERALES">
                <h4 class="mt-3 fw-bold">ECUMINERALES S.A.</h4>
                <p class="text-muted mb-0">Sistema de Gestión de Explosivos e Inventario</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Iniciar sesión
                </button>
            </form>

            <div class="text-center mt-4 small text-muted">
                © 2026 ECUMINERALES S.A.
            </div>

        </div>
    </div>

</body>
</html>
