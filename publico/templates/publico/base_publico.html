{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="{% static 'publico/img/favicon.png' %}" />
    <title>
      {% block title %}
        ECUMINERALES
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'publico/css/estilos.css' %}" />
  </head>
  <body>
    <header class="top">
      <div class="wrap hd">
        <a class="logo" href="{% url 'publico:inicio' %}"><i><img src="{% static 'publico/img/logo.png' %}" alt="" /></i>ECU<span>MINERALES</span></a>
        {% block buscador %}
          <form class="search" role="search" onsubmit="return false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-4-4" />
            </svg>
            <input id="q" type="search" placeholder="Busca productos......." aria-label="Buscar productos" autocomplete="off" />
          </form>
        {% endblock %}
        <div class="acts">
          <a class="link" href="{% url 'publico:inicio' %}#comunicados">Comunicados</a><a class="link" href="{% url 'publico:inicio' %}#contacto">Contacto</a><a class="login" href="{{ login_url }}">Iniciar sesión</a>
        </div>
      </div>
    </header>

    <main class="wrap">
      {% block content %}
      {% endblock %}
    </main>
    <footer>
      <div class="wrap">
        <br />© 2026 ECUMINERALES. Todos los derechos reservados.
      </div>
    </footer>
    {% block scripts %}
    {% endblock %}
  </body>
</html>
